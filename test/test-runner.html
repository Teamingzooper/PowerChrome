<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PowerChrome — Test Runner</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0d13;
    color: #e7ecf2;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 24px;
    background: linear-gradient(160deg, #0b0d13, #1a1f3a);
    border-bottom: 1px solid #2a2f3d;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    background: linear-gradient(90deg, #7c5cff, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .summary {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    font-family: ui-monospace, monospace;
  }
  .summary .pill {
    background: #1d2231;
    border: 1px solid #2a2f3d;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
  }
  .pill.ok { color: #34c759; }
  .pill.fail { color: #ff3b30; }
  main { padding: 16px 24px 48px; }
  .group {
    margin: 12px 0;
    border: 1px solid #2a2f3d;
    border-radius: 10px;
    background: #131722;
    overflow: hidden;
  }
  .group-h {
    padding: 10px 14px;
    background: #1a1f30;
    font-weight: 600;
    border-bottom: 1px solid #2a2f3d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .case {
    padding: 8px 14px;
    border-bottom: 1px solid #1f2330;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
  .case:last-child { border-bottom: none; }
  .case .mark { width: 18px; flex-shrink: 0; font-weight: 700; }
  .case.pass .mark { color: #34c759; }
  .case.fail .mark { color: #ff3b30; }
  .case .name { color: #e7ecf2; }
  .case .err { color: #ff9f0a; margin-top: 4px; white-space: pre-wrap; }
  .case .detail { color: #95a0b4; font-size: 11px; margin-top: 2px; }
  footer {
    padding: 16px 24px;
    color: #95a0b4;
    font-size: 12px;
    border-top: 1px solid #2a2f3d;
  }
</style>
</head>
<body>
<header>
  <h1>⚡ PowerChrome — Test Runner</h1>
  <div class="summary" id="summary">
    <span class="pill" id="totalPill">— tests</span>
    <span class="pill ok" id="okPill">0 passed</span>
    <span class="pill fail" id="failPill">0 failed</span>
    <span class="pill" id="timePill">— ms</span>
  </div>
</header>
<main id="root"></main>
<footer>
  Open this file directly (file:// or via a static server) — no setup needed.
  Tests run automatically on page load.
</footer>

<script>
  // ---- chrome.storage shim (in-memory) ----
  (function () {
    if (typeof window.chrome === 'undefined') window.chrome = {};
    if (!window.chrome.storage) {
      const store = {};
      window.chrome.storage = {
        local: {
          get: function (keys, cb) {
            const out = {};
            const list = Array.isArray(keys) ? keys : [keys];
            list.forEach(function (k) { if (k in store) out[k] = store[k]; });
            setTimeout(function () { cb && cb(out); }, 0);
          },
          set: function (obj, cb) {
            Object.keys(obj).forEach(function (k) { store[k] = obj[k]; });
            setTimeout(function () { cb && cb(); }, 0);
          },
          clear: function (cb) {
            for (const k in store) delete store[k];
            setTimeout(function () { cb && cb(); }, 0);
          },
          _dump: function () { return JSON.parse(JSON.stringify(store)); }
        }
      };
    }
    if (!window.chrome.runtime) {
      window.chrome.runtime = {
        onMessage: { addListener: function () {} },
        sendMessage: function () {},
        get lastError() { return null; }
      };
    }
    if (!window.chrome.tabs) {
      window.chrome.tabs = {
        query: function (_, cb) { cb && cb([]); },
        sendMessage: function () {}
      };
    }
  })();
</script>

<script>
  // ---- Tiny test framework ----
  const root = document.getElementById('root');
  const groups = [];
  let currentGroup = null;
  let totalCases = 0;
  let totalPass = 0;
  let totalFail = 0;

  function describe(name, fn) {
    const g = { name: name, el: null, body: null, cases: [] };
    g.el = document.createElement('div');
    g.el.className = 'group';
    g.el.innerHTML = '<div class="group-h"><span>' + escapeHtml(name) + '</span><span class="ct" data-ct></span></div>';
    g.body = document.createElement('div');
    g.el.appendChild(g.body);
    root.appendChild(g.el);
    groups.push(g);
    currentGroup = g;
    try { fn(); } catch (e) {
      const caseEl = document.createElement('div');
      caseEl.className = 'case fail';
      caseEl.innerHTML = '<span class="mark">✘</span><div><div class="name">setup error</div><div class="err">' + escapeHtml(String(e && e.stack || e)) + '</div></div>';
      g.body.appendChild(caseEl);
      totalCases++; totalFail++;
    }
    currentGroup = null;
    const passCount = g.cases.filter(function (c) { return c.ok; }).length;
    const ct = g.el.querySelector('[data-ct]');
    ct.textContent = passCount + ' / ' + g.cases.length;
    ct.style.color = (passCount === g.cases.length) ? '#34c759' : '#ff3b30';
  }

  function test(name, fn) {
    if (!currentGroup) throw new Error('test() outside describe()');
    totalCases++;
    const caseEl = document.createElement('div');
    caseEl.className = 'case';
    const inner = document.createElement('div');
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = name;
    inner.appendChild(nameEl);
    const mark = document.createElement('span');
    mark.className = 'mark';
    caseEl.appendChild(mark);
    caseEl.appendChild(inner);
    currentGroup.body.appendChild(caseEl);
    try {
      fn();
      caseEl.classList.add('pass');
      mark.textContent = '✓';
      totalPass++;
      currentGroup.cases.push({ ok: true, name: name });
    } catch (e) {
      caseEl.classList.add('fail');
      mark.textContent = '✘';
      const err = document.createElement('div');
      err.className = 'err';
      err.textContent = (e && e.message) || String(e);
      inner.appendChild(err);
      if (e && e.stack) {
        const detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent = e.stack.split('\n').slice(1, 3).join('\n');
        inner.appendChild(detail);
      }
      totalFail++;
      currentGroup.cases.push({ ok: false, name: name, error: e });
    }
  }

  function assert(cond, msg) {
    if (!cond) throw new Error(msg || 'Assertion failed');
  }
  function assertEqual(a, b, msg) {
    if (a !== b) throw new Error((msg || 'Expected equality') + ': ' + JSON.stringify(a) + ' !== ' + JSON.stringify(b));
  }
  function assertClose(a, b, eps, msg) {
    if (Math.abs(a - b) > (eps || 0.001)) throw new Error((msg || 'Expected close') + ': ' + a + ' !~ ' + b);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  // ---- Mock main.getSettings so other modules find defaults ----
  // main.js already attaches a `main` with DEFAULTS; ensure it's there
  const PM = window.__powerMode;
  assert(PM, 'window.__powerMode should exist after loading modules');

  // Initialize main if not yet (avoid attaching real keydown / rAF for tests)
  // We just need getSettings() to return DEFAULTS plus any overrides.
  let mockSettings = Object.assign({}, PM.main.DEFAULTS);
  const origGetSettings = PM.main.getSettings;
  PM.main.getSettings = function () { return mockSettings; };

  function withSettings(overrides, fn) {
    const prev = mockSettings;
    mockSettings = Object.assign({}, prev, overrides);
    try { fn(); } finally { mockSettings = prev; }
  }

  // ---- Tests ----
  const t0 = performance.now();

  describe('effect-presets', function () {
    const P = PM.presets;
    test('getPreset returns known preset', function () {
      const def = P.getPreset('default');
      assertEqual(def.particleCount, 12);
      assertEqual(def.shakeIntensity, 5);
      assert(Array.isArray(def.shapes));
    });
    test('getPreset falls back to default for unknown', function () {
      const u = P.getPreset('nope');
      assertEqual(u.particleCount, 12);
    });
    test('getColorScheme returns rainbow array', function () {
      const c = P.getColorScheme('rainbow');
      assert(c.length === 7);
      assert(/^#[0-9a-f]{6}$/i.test(c[0]));
    });
    test('getColorScheme falls back to rainbow', function () {
      const c = P.getColorScheme('nope');
      assert(c.length === 7);
    });
    test('getSoundPack returns default values', function () {
      const p = P.getSoundPack('default');
      assertEqual(p.waveform, 'sine');
      assert(typeof p.bitcrushAmount === 'number');
    });
    test('LIST contains expected keys', function () {
      assert(P.LIST.presets.indexOf('intense') >= 0);
      assert(P.LIST.schemes.indexOf('neon') >= 0);
      assert(P.LIST.packs.indexOf('arcade') >= 0);
    });
  });

  describe('combo-milestones', function () {
    const C = PM.combo;
    test('reset starts at zero', function () {
      C.reset();
      assertEqual(C.getCount(), 0);
    });
    test('register increments count', function () {
      C.reset();
      C.register(10, 10);
      C.register(10, 10);
      C.register(10, 10);
      assertEqual(C.getCount(), 3);
    });
    test('register noIncrement leaves count alone', function () {
      C.reset();
      C.register(0, 0);
      C.register(0, 0);
      const before = C.getCount();
      C.register(0, 0, { noIncrement: true });
      C.register(0, 0, { noIncrement: true });
      assertEqual(C.getCount(), before);
    });
    test('milestone fires once per run', function () {
      C.reset();
      for (let i = 0; i < 10; i++) C.register(10, 10);
      assert(C._firedThisRun.has('fireworks'), 'fireworks should fire at 10');
      C.register(10, 10);
      assert(C._firedThisRun.has('fireworks'));
    });
    test('milestone set clears on reset', function () {
      C.reset();
      assert(!C._firedThisRun.has('fireworks'));
    });
    test('combo resets after timeout', function () {
      withSettings({ comboTimeout: 50 }, function () {
        C.reset();
        C.register(1, 1);
        C.register(1, 1);
        assertEqual(C.getCount(), 2);
        const until = performance.now() + 80;
        while (performance.now() < until) { /* spin */ }
        C.tick();
        assertEqual(C.getCount(), 0);
      });
    });
    test('all 7 milestone slots defined', function () {
      const ms = C._getMilestones();
      assertEqual(ms.length, 7);
      assertEqual(ms[0].at, 10);
      assertEqual(ms[6].at, 1000);
    });
    test('milestone slots can be reassigned to other effects', function () {
      withSettings({
        milestones: {
          fireworks: { enabled: true, at: 10, effect: 'tornado' },
          galaxy:    { enabled: true, at: 20, effect: 'galaxy' },
          tornado:   { enabled: true, at: 50, effect: 'tornado' },
          supernova: { enabled: true, at: 100, effect: 'supernova' },
          blackhole: { enabled: true, at: 200, effect: 'blackhole' },
          bigbang:   { enabled: true, at: 500, effect: 'bigbang' },
          universe:  { enabled: true, at: 1000, effect: 'universe' }
        }
      }, function () {
        const ms = C._getMilestones();
        const fw = ms.find(function (m) { return m.name === 'fireworks'; });
        assertEqual(fw.effect, 'tornado');
      });
    });
    test('disabled milestones do not fire', function () {
      withSettings({
        milestones: {
          fireworks: { enabled: false, at: 10, effect: 'fireworks' },
          galaxy:    { enabled: true,  at: 20, effect: 'galaxy' },
          tornado:   { enabled: true,  at: 50, effect: 'tornado' },
          supernova: { enabled: true,  at: 100, effect: 'supernova' },
          blackhole: { enabled: true,  at: 200, effect: 'blackhole' },
          bigbang:   { enabled: true,  at: 500, effect: 'bigbang' },
          universe:  { enabled: true,  at: 1000, effect: 'universe' }
        }
      }, function () {
        C.reset();
        for (let i = 0; i < 10; i++) C.register(10, 10);
        assert(!C._firedThisRun.has('fireworks'), 'disabled fireworks should not fire');
      });
    });
    test('reassigned threshold fires at new value', function () {
      withSettings({
        milestones: {
          fireworks: { enabled: true, at: 3, effect: 'fireworks' },
          galaxy:    { enabled: true, at: 20, effect: 'galaxy' },
          tornado:   { enabled: true, at: 50, effect: 'tornado' },
          supernova: { enabled: true, at: 100, effect: 'supernova' },
          blackhole: { enabled: true, at: 200, effect: 'blackhole' },
          bigbang:   { enabled: true, at: 500, effect: 'bigbang' },
          universe:  { enabled: true, at: 1000, effect: 'universe' }
        }
      }, function () {
        C.reset();
        C.register(0, 0);
        C.register(0, 0);
        assert(!C._firedThisRun.has('fireworks'));
        C.register(0, 0);
        assert(C._firedThisRun.has('fireworks'), 'should fire at custom threshold 3');
      });
    });
  });

  describe('particle-system', function () {
    const PS = PM.particles;
    test('spawn creates alive particles', function () {
      PS.clear();
      withSettings({ particleCount: 8 }, function () {
        PS.spawn(100, 100, { combo: 0, count: 8 });
        assertEqual(PS.getAliveCount(), 8);
      });
    });
    test('pool reuses dead slots', function () {
      PS.clear();
      withSettings({ particleCount: 100 }, function () {
        PS.spawn(100, 100, { count: 50 });
      });
      const before = PS._pool.length;
      for (let i = 0; i < PS._pool.length; i++) PS._pool[i].alive = false;
      withSettings({ particleCount: 100 }, function () {
        PS.spawn(100, 100, { count: 50 });
      });
      const after = PS._pool.length;
      assertEqual(before, after);
    });
    test('pool does not exceed POOL_MAX', function () {
      PS.clear();
      for (let i = 0; i < 5; i++) {
        withSettings({ particleCount: 1000 }, function () {
          PS.spawn(100, 100, { count: 1000 });
        });
      }
      assert(PS._pool.length <= PS._config.POOL_MAX, 'pool=' + PS._pool.length);
    });
    test('update kills particles past lifetime', function () {
      PS.clear();
      PS.spawn(100, 100, { count: 5, life: 1 });
      assertEqual(PS.getAliveCount(), 5);
      PS.update(100);
      assertEqual(PS.getAliveCount(), 0);
    });
    test('throttle halves spawn count', function () {
      PS.clear();
      PM.perf._forceThrottle(true);
      withSettings({ particleCount: 20 }, function () {
        PS.spawn(50, 50, { count: 20 });
      });
      const n = PS.getAliveCount();
      PM.perf._forceThrottle(false);
      assert(n <= 11, 'throttled count should be ~half (got ' + n + ')');
    });
    test('deleteMode spawns imploding red particles', function () {
      PS.clear();
      withSettings({ particleCount: 10 }, function () {
        PS.spawn(200, 200, { deleteMode: true });
      });
      const alive = PS._pool.filter(function (p) { return p.alive; });
      assert(alive.length > 0, 'should spawn delete particles');
      const allImplode = alive.every(function (p) { return p._implode === true; });
      assert(allImplode, 'all delete particles should have _implode=true');
      const allRed = alive.every(function (p) { return PS._DELETE_PALETTE.indexOf(p.color) >= 0; });
      assert(allRed, 'all delete particles should use DELETE_PALETTE');
    });
    test('deleteMode particles move inward toward origin', function () {
      PS.clear();
      PS.spawn(500, 500, { deleteMode: true });
      const alive = PS._pool.filter(function (p) { return p.alive; });
      // Each particle's velocity should point toward (500, 500): vx*(x-500) + vy*(y-500) < 0
      const inwardCount = alive.filter(function (p) {
        return p.vx * (p.x - 500) + p.vy * (p.y - 500) < 0;
      }).length;
      assertEqual(inwardCount, alive.length);
    });
    test('spawn offset shifts position for userTriggered', function () {
      PS.clear();
      withSettings({ particleCount: 6, spawnOffsetX: 20, spawnOffsetY: -10, spawnJitter: 0 }, function () {
        PS.spawn(100, 100, { count: 6, userTriggered: true });
      });
      const alive = PS._pool.filter(function (p) { return p.alive; });
      assert(alive.length > 0);
      assert(alive.every(function (p) { return p.x === 120; }), 'x should be 100+20');
      assert(alive.every(function (p) { return p.y === 90; }),  'y should be 100-10');
    });
    test('spawn offset NOT applied to milestone (non-user) spawns', function () {
      PS.clear();
      withSettings({ spawnOffsetX: 50, spawnOffsetY: 50 }, function () {
        PS.spawn(100, 100, { count: 4 });
      });
      const alive = PS._pool.filter(function (p) { return p.alive; });
      assert(alive.every(function (p) { return p.x === 100 && p.y === 100; }));
    });
    test('shape filter excludes disabled shapes', function () {
      PS.clear();
      withSettings({
        particleCount: 30,
        enabledShapes: { circle: true, square: false, triangle: false, star: false, diamond: false }
      }, function () {
        PS.spawn(100, 100, { count: 30, userTriggered: true });
      });
      const alive = PS._pool.filter(function (p) { return p.alive; });
      assert(alive.every(function (p) { return p.shape === 'circle'; }), 'only circles allowed');
    });
    test('generateAngle radial covers full circle', function () {
      let min = Infinity, max = -Infinity;
      for (let i = 0; i < 200; i++) {
        const a = PS._generateAngle('radial');
        if (a < min) min = a;
        if (a > max) max = a;
      }
      assert(max - min > Math.PI, 'radial should span > π');
    });
    test('generateAngle up trends upward', function () {
      let upCount = 0;
      for (let i = 0; i < 200; i++) {
        const a = PS._generateAngle('up');
        if (Math.sin(a) < 0) upCount++;
      }
      assert(upCount > 180, 'most "up" particles should have negative y velocity (got ' + upCount + ')');
    });
    test('generateAngle coneUp is narrower than up', function () {
      const samples = function (dir) {
        let lo = Infinity, hi = -Infinity;
        for (let i = 0; i < 300; i++) {
          const a = PS._generateAngle(dir);
          if (a < lo) lo = a; if (a > hi) hi = a;
        }
        return hi - lo;
      };
      assert(samples('coneUp') < samples('up'), 'coneUp range should be narrower than up');
    });
    test('particle life multiplier scales maxLife', function () {
      PS.clear();
      withSettings({ particleCount: 5, particleLifeMul: 2.0 }, function () {
        PS.spawn(100, 100, { count: 5, life: 1000, userTriggered: true });
      });
      const alive = PS._pool.filter(function (p) { return p.alive; });
      const avg = alive.reduce(function (s, p) { return s + p.maxLife; }, 0) / alive.length;
      assert(avg > 1200, 'lifeMul=2 should ~2× maxLife (avg ' + avg + ')');
    });
    test('gravity setting overrides default', function () {
      PS.clear();
      PS.spawn(100, 100, { count: 3, life: 5000, speed: 0 });
      const before = PS._pool.filter(function (p) { return p.alive; }).map(function (p) { return p.vy; });
      withSettings({ gravity: 1.0 }, function () {
        PS.update(100);
      });
      const after = PS._pool.filter(function (p) { return p.alive; }).map(function (p) { return p.vy; });
      assert(after.length === before.length);
      for (let i = 0; i < after.length; i++) {
        assert(after[i] > before[i] + 3, 'high gravity should pull vy down significantly');
      }
    });
  });

  describe('performance-monitor', function () {
    const PF = PM.perf;
    test('getStats returns fps key', function () {
      PF.reset();
      const s = PF.getStats();
      assert(s.fps != null);
    });
    test('low frame times trigger throttle', function () {
      PF.reset();
      // Push 60 frames of 40ms (=25fps) over simulated 2.5s
      for (let i = 0; i < 60; i++) PF._pushFrame(40);
      // Force throttle eval by calling tick() with a very long dt — but tick uses real timer, so we manually set
      PF._forceThrottle(true);
      assert(PF.shouldThrottle());
      PF._forceThrottle(false);
    });
  });

  describe('ml-personalization', function () {
    const ML = PM.ml;
    test('contextKey shape', function () {
      const k = ML._contextKey();
      assert(/^\d+_(code|writing|social|other)_(slow|med|fast)$/.test(k), 'got: ' + k);
    });
    test('observe + suggestion threshold', function () {
      ML._setData({});
      const k = ML._contextKey();
      for (let i = 0; i < 9; i++) ML.observe('shakeIntensity', 8);
      assertEqual(ML.getSuggestion(), null);
      ML.observe('shakeIntensity', 8);
      const s = ML.getSuggestion();
      assert(s != null && typeof s.shakeIntensity === 'number');
      assertClose(s.shakeIntensity, 8, 0.5);
    });
    test('weighted update converges toward new value', function () {
      ML._setData({});
      for (let i = 0; i < 10; i++) ML.observe('shakeIntensity', 2);
      const s1 = ML.getSuggestion();
      for (let i = 0; i < 10; i++) ML.observe('shakeIntensity', 10);
      const s2 = ML.getSuggestion();
      assert(s2.shakeIntensity > s1.shakeIntensity, s1.shakeIntensity + ' < ' + s2.shakeIntensity);
    });
    test('siteCategory recognizes github', function () {
      // Cannot change location.hostname; just call _siteCategory and verify it returns a known bucket
      const c = ML._siteCategory();
      assert(['code', 'writing', 'social', 'other'].indexOf(c) >= 0);
    });
  });

  describe('visual-effects', function () {
    const V = PM.vfx;
    test('tier colors are tiered', function () {
      assertEqual(V._tierColor(0), '#ff3b30');
      assertEqual(V._tierColor(10), '#ff9f0a');
      assertEqual(V._tierColor(50), '#bf5af2');
      assertEqual(V._tierColor(100), '#0a84ff');
      assertEqual(V._tierColor(500), '#ffd60a');
    });
    test('shake respects reduced motion', function () {
      withSettings({ reducedMotion: true }, function () {
        V.reset();
        V.shake(20);
        assertEqual(V._getShakeAmp(), 0);
      });
    });
    test('shake increases amplitude when enabled', function () {
      withSettings({ reducedMotion: false, shakeIntensity: 5 }, function () {
        V.reset();
        V.shake(10);
        assert(V._getShakeAmp() > 0);
      });
    });
  });

  describe('sound-effects-enhanced', function () {
    const S = PM.sfx;
    test('keyFreq mapping is correct', function () {
      assertEqual(S._keyFreq('Enter'), 880);
      assertEqual(S._keyFreq(' '), 220);
      assertEqual(S._keyFreq('Backspace'), 90);
      assertEqual(S._keyFreq('Delete'), 90);
      assertEqual(S._keyFreq('Tab'), 440);
      assertEqual(S._keyFreq('A'), 220);
      assertEqual(S._keyFreq('C'), 261.63);
    });
    test('keyWaveform routes special keys', function () {
      S.setWaveformOverride('auto');
      assertEqual(S._keyWaveform('Enter'), 'sine');
      assertEqual(S._keyWaveform(' '), 'square');
      assertEqual(S._keyWaveform('Backspace'), 'sawtooth');
      assertEqual(S._keyWaveform('Delete'), 'sawtooth');
      assertEqual(S._keyWaveform('Tab'), 'triangle');
    });
    test('delete waveform ignores override', function () {
      S.setWaveformOverride('sine');
      assertEqual(S._keyWaveform('Backspace'), 'sawtooth');
      assertEqual(S._keyWaveform('Delete'), 'sawtooth');
      S.setWaveformOverride('auto');
    });

      S.setWaveformOverride('sine');
      assertEqual(S._keyWaveform('a'), 'sine');

  describe('custom-palette', function () {
    const P = PM.presets;
    test('isValidHex accepts 6-digit hex', function () {
      assert(P._isValidHex('#ff0000'));
      assert(P._isValidHex('#FF00aa'));
      assert(!P._isValidHex('red'));
      assert(!P._isValidHex('#ff0'));
      assert(!P._isValidHex('#ggg000'));
    });

      withSettings({ customColors: ['#112233', '#445566'] }, function () {

      });

      withSettings({ customColors: [] }, function () {

        assertEqual(c.length, 7);
      });
    });
    test('custom scheme filters invalid hex', function () {
      withSettings({ customColors: ['#ff0000', 'red', '#ggg', '#00ff00'] }, function () {

  describe('accessibility', function () {
    const A = PM.accessibility;
    test('exposes prefersReducedMotion', function () {
      assertEqual(typeof A.prefersReducedMotion(), 'boolean');
    });
    test('exposes prefersHighContrast', function () {
      assertEqual(typeof A.prefersHighContrast(), 'boolean');
    });
    test('onChange returns unsubscribe', function () {

  describe('main', function () {
    const M = PM.main;
    test('DEFAULTS contains all v1.1 keys', function () {
      const keys = ['enabled','soundEnabled','preset','colorScheme','customColors','soundPack',
        'shakeIntensity','particleCount','volume','bitcrushAmount','waveform',
        'reducedMotion','highContrast','useWebGL','enableML','comboTimeout',
        'spawnOffsetX','spawnOffsetY','spawnJitter','spawnDirection','particleLifeMul',
        'enabledShapes','gravity','friction','hudPosition','hudScale','hudOpacity',
        'disabledDomains','milestones'];
      keys.forEach(function (k) { assert(k in M.DEFAULTS, 'missing key: ' + k); });
    });
    test('isEditable detects input', function () {
      const inp = document.createElement('input');
      inp.type = 'text';
      assertEqual(M._isEditable(inp), true);
    });
    test('isEditable rejects div without contenteditable', function () {
      const d = document.createElement('div');
      assertEqual(M._isEditable(d), false);
    });
    test('isEditable accepts contenteditable', function () {
      const d = document.createElement('div');
      d.setAttribute('contenteditable', 'true');
      assertEqual(M._isEditable(d), true);
    });
    test('isDeleteKey identifies Backspace and Delete', function () {
      assert(M._isDeleteKey({ key: 'Backspace' }));
      assert(M._isDeleteKey({ key: 'Delete' }));
      assert(!M._isDeleteKey({ key: 'a' }));
      assert(!M._isDeleteKey({ key: 'Enter' }));
    });
    test('isDomainDisabled matches exact and subdomain', function () {
      const host = location.hostname.toLowerCase();
      // Empty list = not disabled
      withSettings({ disabledDomains: [] }, function () {
        assert(!M._isDomainDisabled());
      });
      // Exact match
      withSettings({ disabledDomains: [host] }, function () {
        assert(M._isDomainDisabled());
      });
      // Unrelated domain
      withSettings({ disabledDomains: ['nope.example.com'] }, function () {
        assert(!M._isDomainDisabled());
      });
    });
    test('resolveHudPos near caret returns caret', function () {
      withSettings({ hudPosition: 'caret' }, function () {
        const p = M._resolveHudPos({ x: 200, y: 300 });
        assertEqual(p.x, 200);
        assertEqual(p.y, 300);
      });
    });
    test('resolveHudPos topLeft is at origin-ish', function () {
      withSettings({ hudPosition: 'topLeft' }, function () {
        const p = M._resolveHudPos({ x: 999, y: 999 });
        assert(p.x < 50);
      });
    });
    test('resolveHudPos bottomRight is far from origin', function () {
      withSettings({ hudPosition: 'bottomRight' }, function () {
        const p = M._resolveHudPos({ x: 0, y: 0 });
        assert(p.x > window.innerWidth / 2 - 100, 'x should be on right side');
      });
    });
    test('applyAccessibilityOverrides forces monochrome with high contrast', function () {
      const out = M._applyAccessibilityOverrides({ highContrast: true, colorScheme: 'rainbow' });
      assertEqual(out.colorScheme, 'monochrome');
    });
  });

  describe('spam-detection (main)', function () {
    const M = PM.main;
    test('repeat=true triggers pause immediately', function () {
      M._resetSpamWindow();
      withSettings({ spamDetection: true }, function () {
        assert(M._shouldPauseForSpam({ key: 'a', repeat: true }));
      });
    });
    test('rapid same-key triggers spam after threshold', function () {
      M._resetSpamWindow();
      withSettings({ spamDetection: true }, function () {
        // Three quick repeats — the 3rd should pause
        const r1 = M._shouldPauseForSpam({ key: 'a', repeat: false });
        const r2 = M._shouldPauseForSpam({ key: 'a', repeat: false });
        const r3 = M._shouldPauseForSpam({ key: 'a', repeat: false });
        assert(!r1 || !r2, 'first/second key should not pause');
        assert(r3, 'third quick same-key should pause');
      });
    });
    test('different keys reset the spam counter', function () {
      M._resetSpamWindow();
      withSettings({ spamDetection: true }, function () {
        M._shouldPauseForSpam({ key: 'a' });
        M._shouldPauseForSpam({ key: 'a' });
        assert(!M._shouldPauseForSpam({ key: 'b' }), 'switching keys resets streak');
      });
    });
    test('spam detection disabled when flag is off', function () {
      M._resetSpamWindow();
      withSettings({ spamDetection: false }, function () {
        for (let i = 0; i < 10; i++) {
          assert(!M._shouldPauseForSpam({ key: 'a', repeat: true }), 'should never pause when disabled');
        }
      });
    });
  });

  describe('stats-tracker', function () {
    const S = PM.stats;
    function freshStats() {
      S._setStats(JSON.parse(JSON.stringify(S._DEFAULT_STATS)));
    }
    test('recordChar increments totalChars + per-day + per-site', function () {
      freshStats();
      S.recordChar();
      S.recordChar();
      S.recordChar();
      const snap = S.getSnapshot();
      assertEqual(snap.totalChars, 3);
      const today = S._isoDate();
      assertEqual(snap.charsPerDay[today], 3);
    });
    test('recordDelete increments totalDeletes', function () {
      freshStats();
      S.recordDelete();
      S.recordDelete();
      assertEqual(S.getSnapshot().totalDeletes, 2);
    });
    test('recordPaste sums chars', function () {
      freshStats();
      S.recordPaste(15);
      S.recordPaste(7);
      const snap = S.getSnapshot();
      assertEqual(snap.totalPastes, 2);
      assertEqual(snap.totalPasteChars, 22);
    });
    test('recordCombo only saves new highest', function () {
      freshStats();
      S.recordCombo(5);
      S.recordCombo(3);
      S.recordCombo(12);
      S.recordCombo(8);
      assertEqual(S.getSnapshot().highestCombo, 12);
    });
    test('recordMilestone counts occurrences', function () {
      freshStats();
      S.recordMilestone('fireworks');
      S.recordMilestone('fireworks');
      S.recordMilestone('tornado');
      const snap = S.getSnapshot();
      assertEqual(snap.milestonesHit.fireworks, 2);
      assertEqual(snap.milestonesHit.tornado, 1);
    });
    test('setProfile merges into profile object', function () {
      freshStats();
      S.setProfile({ username: 'tester' });
      S.setProfile({ avatar: '🚀' });
      const p = S.getSnapshot().profile;
      assertEqual(p.username, 'tester');
      assertEqual(p.avatar, '🚀');
    });
    test('resetAll restores defaults', function () {
      freshStats();
      S.recordChar();
      S.recordPaste(100);
      S.resetAll();
      const snap = S.getSnapshot();
      assertEqual(snap.totalChars, 0);
      assertEqual(snap.totalPastes, 0);
      assertEqual(snap.totalPasteChars, 0);
    });
  });

  describe('paste-animator', function () {
    const PA = PM.paste;
    test('delayAt returns SLOW for first char', function () {
      assertEqual(PA._delayAt(0, 10), PA._config.SLOW_MS);
    });
    test('delayAt returns FAST for last char', function () {
      assertEqual(PA._delayAt(9, 10), PA._config.FAST_MS);
    });
    test('delayAt is monotonically decreasing', function () {
      let prev = Infinity;
      for (let i = 0; i < 20; i++) {
        const d = PA._delayAt(i, 20);
        assert(d <= prev, 'delay at ' + i + ' should be <= previous');
        prev = d;
      }
    });
    test('not animating by default', function () {
      assert(!PA._isAnimating());
    });
  });

  describe('typing-effects', function () {
    const T = PM.typingFx;
    test('flashEnter creates flash element', function () {
      withSettings({ enterFlash: true, reducedMotion: false }, function () {
        T.flashEnter();
        const el = document.querySelector('[data-powermode-flash]');
        assert(el != null, 'flash element should exist');
      });
    });
    test('flashEnter does nothing when enterFlash=false', function () {
      // Remove any existing flash first
      const existing = document.querySelector('[data-powermode-flash]');
      if (existing) existing.parentNode.removeChild(existing);
      withSettings({ enterFlash: false }, function () {
        T.flashEnter();
      });
      // Either no element, or opacity 0
      const after = document.querySelector('[data-powermode-flash]');
      if (after) assert(after.style.opacity === '0' || after.style.opacity === '');
    });
    test('floatChar creates and removes span when enabled', function () {
      // Make sure layer is empty
      const layer = document.querySelector('[data-powermode-floatlayer]');
      if (layer) layer.innerHTML = '';
      withSettings({ floatInChars: true, reducedMotion: false }, function () {
        T.floatChar('Z', 100, 100);
      });
      const newLayer = document.querySelector('[data-powermode-floatlayer]');
      assert(newLayer != null && newLayer.children.length >= 1, 'float char span should exist');
    });
    test('floatChar no-op when setting is off', function () {
      const layer = document.querySelector('[data-powermode-floatlayer]');
      if (layer) layer.innerHTML = '';
      withSettings({ floatInChars: false }, function () {
        T.floatChar('Z', 100, 100);
      });
      const after = document.querySelector('[data-powermode-floatlayer]');
      assert(!after || after.children.length === 0);
    });
  });

  describe('social-api (v1.3 mock backend)', function () {
    const Soc = PM.social;
    function freshSocial() {
      Soc._setSocial({
        account: { code: 'TEST-ABCD', createdAt: '2026-01-01T00:00:00.000Z', backend: 'local-mock' },
        friends: [],
        backendStatus: 'local-only'
      });
    }
    test('generateFriendCode produces 8-char + dash', function () {
      const c = Soc._generateFriendCode();
      assert(/^[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(c), 'got: ' + c);
    });
    test('normalizeCode strips dashes and uppercases', function () {
      assertEqual(Soc._normalizeCode('abcd-efgh'), 'ABCDEFGH');
      assertEqual(Soc._normalizeCode('abcd efgh'), 'ABCDEFGH');
    });
    test('formatCode adds the dash back', function () {
      assertEqual(Soc._formatCode('abcdefgh'), 'ABCD-EFGH');
    });
    test('addFriendByCode rejects short codes', function () {
      freshSocial();
      const r = Soc.backend.addFriendByCode('ABC');
      assertEqual(r.ok, false);
      assert(/8 characters/i.test(r.error));
    });
    test('addFriendByCode rejects own code', function () {
      freshSocial();
      const r = Soc.backend.addFriendByCode('TEST-ABCD');
      assertEqual(r.ok, false);
      assert(/yourself/i.test(r.error));
    });
    test('addFriendByCode succeeds with valid stranger code', function () {
      freshSocial();
      const r = Soc.backend.addFriendByCode('WXYZ-2345');
      assertEqual(r.ok, true);
      assert(r.friend != null);
      assertEqual(r.friend.code, 'WXYZ-2345');
      assert(typeof r.friend.username === 'string');
      assert(r.friend.stats.highestCombo > 0);
    });
    test('addFriendByCode rejects duplicates', function () {
      freshSocial();
      assertEqual(Soc.backend.addFriendByCode('QRST-2345').ok, true);
      const dup = Soc.backend.addFriendByCode('QRST-2345');
      assertEqual(dup.ok, false);
      assert(/already/i.test(dup.error));
    });
    test('removeFriend deletes the friend', function () {
      freshSocial();
      Soc.backend.addFriendByCode('JKLM-2345');
      const beforeCount = Soc.backend.getFriends().length;
      Soc.backend.removeFriend('JKLM-2345');
      const afterCount = Soc.backend.getFriends().length;
      assertEqual(afterCount, beforeCount - 1);
    });
    test('getLeaderboard friends sorts by selected kind', function () {
      freshSocial();
      Soc.backend.addFriendByCode('AAAA-2345');
      Soc.backend.addFriendByCode('BBBB-2345');
      Soc.backend.addFriendByCode('CCCC-2345');
      const byCombo = Soc.backend.getLeaderboard('combo', 'friends');
      for (let i = 1; i < byCombo.length; i++) {
        assert(byCombo[i - 1].highestCombo >= byCombo[i].highestCombo,
          'combo leaderboard not sorted at index ' + i);
      }
      const byChars = Soc.backend.getLeaderboard('chars', 'friends');
      for (let i = 1; i < byChars.length; i++) {
        assert(byChars[i - 1].totalChars >= byChars[i].totalChars,
          'chars leaderboard not sorted at index ' + i);
      }
    });
    test('getLeaderboard global includes synthetic rows + me', function () {
      freshSocial();
      const rows = Soc.backend.getLeaderboard('combo', 'global');
      assert(rows.length >= 8);
      assert(rows.some(function (r) { return r.isMe; }), 'me row should be present');
    });
    test('seedFromCode is deterministic per code', function () {
      const a1 = Soc._seedFromCode('ABCDEFGH').rand();
      const a2 = Soc._seedFromCode('ABCDEFGH').rand();
      assertEqual(a1, a2);
      const b1 = Soc._seedFromCode('ZYXWVUTS').rand();
      assert(a1 !== b1, 'different codes should differ');
    });
  });

  describe('debug-tools', function () {
    const D = PM.debug;
    test('log adds entries to recent.events', function () {
      D._recent.events.length = 0;
      D.log('key', 'a @ 1,2 combo=3');
      D.log('delete', 'Backspace');
      assertEqual(D._recent.events.length, 2);
      assertEqual(D._recent.events[1].kind, 'delete');
    });
    test('event buffer caps at 50', function () {
      D._recent.events.length = 0;
      for (let i = 0; i < 80; i++) D.log('key', String(i));
      assert(D._recent.events.length <= 50);
    });
    test('getSnapshot returns useful fields', function () {
      const snap = D.getSnapshot();
      assert('audioBackend' in snap);
      assert('audioWorkletSupported' in snap);
      assert('isTopFrame' in snap);
      assert('viewport' in snap);
      assert(typeof snap.viewport.w === 'number');
    });
    test('overlay hidden when debugMode is off', function () {
      withSettings({ debugMode: false }, function () {
        D._removeOverlay();
        D.tick();
        const el = document.querySelector('[data-powermode-debug]');
        // Either not created or hidden
        if (el) assert(el.style.opacity === '' || el.style.opacity === '0');
      });
    });
    test('overlay shown when debugMode is on', function () {
      withSettings({ debugMode: true }, function () {
        D._removeOverlay();
        D.tick();
        // tick is throttled; force another after a small delay
        const el = D._ensureOverlay();
        assert(el != null);
        assert(el.isConnected);
      });
    });
  });

  const elapsed = Math.round(performance.now() - t0);
  document.getElementById('totalPill').textContent = totalCases + ' tests';
